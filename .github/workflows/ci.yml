name: Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      # The suite is plain `python`, not pytest, so it runs on any interpreter.
      # Test files sandbox SENTINEL_HOME themselves; the extra export below is
      # a belt-and-braces guard so a leak can never touch the runner's home.
      - name: Run unit tests
        env:
          SENTINEL_HOME: ${{ runner.temp }}/sentinel-ci-state
        run: |
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t"
            echo "::endgroup::"
          done

      - name: Run tests under pytest
        env:
          SENTINEL_HOME: ${{ runner.temp }}/sentinel-ci-state-pytest
        run: python -m pytest tests/ -q

      - name: Verify the state directory was not polluted
        env:
          SENTINEL_HOME: ${{ runner.temp }}/sentinel-ci-state
        run: |
          if [ -e "$HOME/.sentinel" ]; then
            echo "::error::tests wrote to the real ~/.sentinel"
            ls -la "$HOME/.sentinel"
            exit 1
          fi

      - name: Verify zero third-party imports in the agent core
        run: |
          python - <<'PY'
          import ast, os, sys
          std = set(sys.stdlib_module_names)
          offenders = []
          for root, _, files in os.walk("sentinel"):
              for f in files:
                  if not f.endswith(".py"):
                      continue
                  path = os.path.join(root, f)
                  tree = ast.parse(open(path, encoding="utf-8").read())
                  for node in ast.walk(tree):
                      mods = []
                      if isinstance(node, ast.Import):
                          mods = [a.name.split(".")[0] for a in node.names]
                      elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                          mods = [node.module.split(".")[0]]
                      for m in mods:
                          if m not in std and m != "sentinel":
                              offenders.append(f"{path}: {m}")
          if offenders:
              print("::error::undeclared third-party imports in the agent core")
              for o in offenders:
                  print("  " + o)
              sys.exit(1)
          print("agent core is standard-library only")
          PY

      - name: Build and test native C99 daemon
        run: |
          make
          make test

      - name: Build with strict warnings
        run: |
          gcc -O3 -Wall -Wextra -Werror -std=c99 -c src/sentineld.c -o /dev/null
          echo "no warnings under -Wall -Wextra -Werror"
