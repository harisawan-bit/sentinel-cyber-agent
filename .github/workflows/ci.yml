name: Sentinel CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run unit tests
        run: |
          python tests/test_core.py
          python tests/test_homelab.py
          python tests/test_server_defense.py
          python tests/test_remediation.py
          python tests/test_sarif.py
          python tests/test_daemon.py
          python tests/test_honeyport.py
          python tests/test_fim.py
          python tests/test_sigma.py
          python tests/test_deception.py

      - name: Build and test native C99 daemon
        run: |
          make
          make test
