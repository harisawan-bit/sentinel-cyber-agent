[package]
name = "sentinel"
version = "2.0.0"
edition = "2024"
authors = ["Sentinel Security <sentinel@security>"]
description = "Ultimate homelab security platform — eBPF + MCP + AI-powered"
license = "MIT"
repository = "https://github.com/harisawan-bit/sentinel-cyber-agent"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
rusqlite = { version = "0.38", features = ["bundled"] }
clap = { version = "4.5", features = ["derive", "env"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12", features = ["json"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "0.17"
rustls = "0.23"
sysinfo = "0.38"
config = "0.15"
dirs = "6.0"
cron = "0.15"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.18", features = ["v4"] }

[features]
default = ["server", "cli"]
server = []
cli = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "sentinel"
path = "src/main.rs"
