[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-cyber-agent"
version = "2.4.0"
description = "Unified MIT-licensed cyber security orchestration agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["security", "hardening", "honeyport", "fim", "sarif", "sigma", "attack-surface"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# The agent core imports only the standard library. sherlock-project is the
# single optional runtime dependency, used solely by the `sherlock` OSINT
# plugin; without it that plugin emits an info note and everything else is
# unaffected. See README "Zero-Dependency Philosophy".
dependencies = [
    "sherlock-project>=0.14.3",
]

[project.urls]
Homepage = "https://github.com/harisawan-bit/sentinel-cyber-agent"
Issues = "https://github.com/harisawan-bit/sentinel-cyber-agent/issues"
Security = "https://github.com/harisawan-bit/sentinel-cyber-agent/security/policy"

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools]
packages = [
    "sentinel",
    "sentinel.core",
    "sentinel.core.plugins",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
